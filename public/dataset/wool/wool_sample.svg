<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="wool-knit" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#9f1239"/>
      <path d="M 0 12 C 6 4, 18 4, 24 12 C 18 20, 6 20, 0 12 Z" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
      <path d="M 12 0 C 18 6, 18 18, 12 24 C 6 18, 6 6, 12 0 Z" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.7"/>
    </pattern>
    <linearGradient id="wool-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wool-grad)"/>
  <rect width="600" height="400" fill="url(#wool-knit)" opacity="0.8"/>
  <text x="300" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">WOOL TEXTILE SAMPLE</text>
  <text x="300" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#fecdd3" text-anchor="middle">Heavy Thermal Yarn Knitted Texture</text>
</svg>
