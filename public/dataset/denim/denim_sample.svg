<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="denim-twill" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1e3a8a"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3b82f6" stroke-width="4"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
    </pattern>
    <linearGradient id="denim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#denim-grad)"/>
  <rect width="600" height="400" fill="url(#denim-twill)" opacity="0.85"/>
  <path d="M 0 150 Q 200 130 400 170 T 600 140" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6,4" fill="none" opacity="0.8"/>
  <text x="300" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">DENIM TEXTILE SAMPLE</text>
  <text x="300" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">Heavyweight Diagonal Twill Weave</text>
</svg>
