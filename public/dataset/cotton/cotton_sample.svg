<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="cotton-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f8fafc"/>
      <path d="M0 8h16M8 0v16" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="4" cy="4" r="1.5" fill="#cbd5e1" opacity="0.6"/>
      <circle cx="12" cy="12" r="1.5" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <linearGradient id="cotton-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cotton-grad)"/>
  <rect width="600" height="400" fill="url(#cotton-pattern)" opacity="0.7"/>
  <!-- Fabric Soft Texture Overlays -->
  <path d="M 0 100 Q 150 120 300 100 T 600 100 L 600 400 L 0 400 Z" fill="#000" opacity="0.02"/>
  <text x="300" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#475569" text-anchor="middle">COTTON TEXTILE SAMPLE</text>
  <text x="300" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Natural Soft Absorbent Weave</text>
</svg>
