<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="poly-knit" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#0284c7"/>
      <circle cx="5" cy="5" r="3" fill="#38bdf8" opacity="0.6"/>
      <path d="M0 5h10M5 0v10" stroke="#0ea5e9" stroke-width="1"/>
    </pattern>
    <linearGradient id="poly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#poly-grad)"/>
  <rect width="600" height="400" fill="url(#poly-knit)" opacity="0.8"/>
  <text x="300" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">POLYESTER TEXTILE SAMPLE</text>
  <text x="300" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle">Synthetic Wrinkle-Resistant Microfiber</text>
